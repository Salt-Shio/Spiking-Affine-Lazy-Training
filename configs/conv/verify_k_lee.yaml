run_name: verify_k_lee
# V6 init_k 對照組 R1:方法 I / Lee 變異數保持。
# conv1/conv2 init_k = sqrt(3) ≈ 1.7320508(limit = sqrt(3/fan_in),即 E[w^2]=1/fan_in)。
# 與 verify_k5 / verify_k_firing / verify_k8 唯一的差別就是 conv 層 init_k;
# chunk_size / L / max_out_spikes / tau / v_th / alpha / lr / batch / seed 全部一致。
# 推導見 docs/math/初始權重尺度推導.md 步驟 6。

model:
  decoder: membrane_regression
  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 185
      max_out_spikes: 9000
      init_k: 1.7320508
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 32
      max_out_spikes: 45000
      init_k: 1.7320508
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 512
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 10
  batch_size: 4
  seed: 42
