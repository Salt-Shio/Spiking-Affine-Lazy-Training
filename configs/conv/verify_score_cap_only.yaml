run_name: compressed_score_cap_only_verify
# 單獨驗證 score_cap(夾住輸出上限):複製自 baseline.yaml,只加
# train.score_cap,不設 weight_decay/grad_clip_norm。label_smoothing 已撤除
# (docs/問題紀錄.md 第十五節——單獨測試也重現了跟三旋鈕一起上時一樣的大量
# 神經元死亡,已確認不是 grad_clip_norm 單獨造成的,連 label smoothing 自己
# 都會觸發)。
#
# 動機(docs/math/梯度下降曲率穩定性推導.md 第 8.4 節):跟前兩個機制不同,
# 這裡不改權重量級(weight_decay)、不改分類目標(label_smoothing),改的是
# decoder 輸出分數本身能不能無界增長——直接對準 docs/問題紀錄.md 第十五節
# 診斷的根因(「decoder 輸出無上限,logit 差距可以無界增長」)。
#
# score_cap=6.0 的來源:原始(無修正)100-epoch 跑法在 epoch38(炸開前最好的
# 一個 epoch,train_loss=8.9e-5)反推 logit 差距 Δ≈9.3~11.5(問題紀錄.md 第
# 十五節、這次用理論公式重算)。score_cap 太大(例如一開始討論時隨口說的
# 10~12)會讓 Δ 上限(=2*score_cap)遠超過這個「已經開始不穩定」的操作點,
# 等於沒真的夾住;score_cap 太小又會跟 label smoothing 一樣把正常訓練的推力
# 一起打折。6.0(Δ上限=12)刻意設在「原始跑法炸開前那個操作點」附近,留一點
# 餘裕但不留太多。

model:
  decoder: membrane_regression

  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      L: 185
      max_out_spikes: 1
      max_steps: 1
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      L: 32
      max_out_spikes: 1
      max_steps: 1
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 1024
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 100
  batch_size: 4
  seed: 42
  weight_snapshot_every: 1
  score_cap: 6.0
