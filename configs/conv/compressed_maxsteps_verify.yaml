run_name: compressed_maxsteps_verify
# max_steps 跟 L 脫鉤這批改動的驗證用 config,複製自 compressed_baseline.yaml,
# 不動 baseline 本身。跟 baseline 的差異:conv2 的 max_out_spikes 改小、兩個
# conv 層都明確給 max_steps 一個很小的起始猜測。
#
# max_out_spikes 改的理由:baseline 原本 conv2 max_out_spikes=45000,跟 conv1
# 的 9000 量級不合理——conv2 神經元數 1296 比 conv1 的 2312 少,buffer 卻是
# 5 倍大,不是「留餘裕」能解釋的落差。改成跟 conv1 同量級的保守起始猜測,交給
# grown_to_fit 自己長,順便讓這次驗證跑到 max_out_spikes 的出界放大路徑
# (baseline 原本的 45000 结构上打不到)。
#
# max_steps 起始值改的理由(2026-09-12 修掉「用 probe_batch 縮小造成無限
# 循環」那個 bug 之後的設計):max_steps 不再靠 __post_init__ 的 self.L
# fallback 打底,而是像 L / max_out_spikes 一樣給一個小的起始猜測,交給
# grown_to_fit 用真實 batch 資料自己長到夠用——這裡故意設 1,確保這次驗證
# 一定會在 epoch 0 batch 0 就走到 max_steps 的出界放大路徑。
#
# 其餘設定(L / max_steps_reestimate_every 用預設 1)都跟 baseline 一致,讓
# Part 2(grown_to_fit 放大三個旋鈕)、Part 3(epoch 成功跑完後用真實觀察值
# 縮小 max_steps / max_out_spikes)這次審過的路徑都有機會在這次跑裡被走到。
#
# max_out_spikes 縮小(2026-09-12 補上,見 docs/問題紀錄.md 第十四節):吃的是
# 真實觀察值 LayerDiag.n_out_spikes,不是任何理論上界(曾經試過用 m* 算的
# Σm*_i 當長大/縮小訊號,實測太鬆、已撤回)。out_shrink_threshold 明確填出來
# 只是跟 max_steps_shrink_threshold 對齊寫法,值本身就是類別預設。
#
# 兩個 conv 層的 chunk_size 從 baseline 的 1 改成 4:chunk_size=1 時
# spike_step_upper_bound 算出來的 min_steps_needed 數學上恆等於 L
# (T = m* + ceil((L-m*)/1) = L,見 docs/math/掃描步數上界推導.md 第 4 節),
# Part 3 的縮小機制在這個前提下 structurally 永遠不會觸發。要驗證縮小路徑
# 真的能動,chunk_size 必須 > 1。

model:
  decoder: membrane_regression

  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4            # 1 會讓 min_steps_needed 恆等於 L(見下方說明),改 >1
      L: 185
      max_out_spikes: 1
      max_steps: 1             # 小起始猜測,交給 grown_to_fit 自己長(見檔頭說明)
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4            # 同上
      L: 32
      max_out_spikes: 1    # baseline 是 45000,見檔頭說明
      max_steps: 1             # 同上
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 1024
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 40
  batch_size: 4
  seed: 42
  probe_every: 5
  probe_samples: 8
  probe_full_every: 20
  probe_full_samples: 2
