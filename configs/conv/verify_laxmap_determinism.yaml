run_name: laxmap_determinism_verify
# 2026-09-18:驗證 example/models/conv_net.py 的 apply_batched 從 jax.vmap
# 改成 jax.lax.map(見 docs/問題紀錄.md 第八節)之後,搭配
# XLA_FLAGS=--xla_gpu_deterministic_ops=true,同一份 config 跑兩次是否真的
# bit-exact 一樣——不是量準確率,是量「兩次 run 的 metrics.csv 逐行數字能不能
# 對上」。複製自 baseline.yaml,只改 epochs(100 -> 10,縮短驗證時間)跟
# run_name,其餘設定(含 chunk_size>1 那些理由)不變,見 baseline.yaml 檔頭
# 說明。

model:
  decoder: membrane_regression

  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      L: 185
      max_out_spikes: 1
      max_steps: 1
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      L: 32
      max_out_spikes: 1
      max_steps: 1
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 1024
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 10
  batch_size: 4
  seed: 42
  weight_snapshot_every: 1
