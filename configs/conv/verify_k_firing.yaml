run_name: verify_k_firing
# V6 init_k 對照組 R3:舊 firing-rate 目標帶 [0.20, 0.50] 掃出來的值
# (段 3.8:conv1 init_k=8.0、conv2 init_k=64.0)。用來重現「best val ~74%」
# 並觀察事件爆炸(max_out_spikes 反覆出界放大)。fc init_k 仍 5.0。

model:
  decoder: membrane_regression
  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 185
      max_out_spikes: 9000
      init_k: 8.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 32
      max_out_spikes: 45000
      init_k: 64.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 512
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 10
  batch_size: 4
  seed: 42
