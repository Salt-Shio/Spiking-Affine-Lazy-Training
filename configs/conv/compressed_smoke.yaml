run_name: compressed_smoke
# 動態放大機制驗證用:小規模資料 + 小 epoch 數,快速確認「偵測出界 -> 放大 ->
# 退 checkpoint 續練」真的會動(不是量產訓練配置)。conv2 的 L / 兩個
# max_out_spikes 都刻意設小,強制訓練早期走一次完整的出界路徑。
# 網路形狀由 model.layers 決定,見 src/models/conv_net.py build_network。

model:
  decoder: membrane_regression   # 見 salt_core.decoder;留白也是這個

  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 185                     # 靜態精算值,smoke 規模不會出界
      max_out_spikes: 800        # 刻意設小 -> 輸出上界出界、放大
      init_k: 8.0                # 填死值讓 e2e smoke 保持確定性(留白會觸發開訓前校準)
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 32                      # 刻意設小 -> 訓練早期一定出界、放大
      max_out_spikes: 600        # 刻意設小 -> 輸出上界出界、放大
      init_k: 64.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 512
      init_k: 5.0

data:
  max_events: 2000
  train_size: 16
  val_size: 8
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 3                      # 故意留超過 1 個 epoch:確認出界重來後,後續 epoch
                                  # 還能正常繼續、checkpoint 邏輯不會卡住。
  batch_size: 4
  seed: 42
  weight_snapshot_every: 1        # 逐 epoch 權重快照(0 = 關):每幾個 epoch 存一份純權重
                                   # 到 weights/epoch_XXX.npz,給事後分析工具用。
