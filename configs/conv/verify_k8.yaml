run_name: verify_k8
# V6 init_k 對照組 R4:「均勻偏熱」—— conv1/conv2 都 init_k=8.0。
# 隔離「整體偏熱」的效果,不含 verify_k_firing 那個極端的 conv2=64.0。
# fc init_k 仍 5.0。

model:
  decoder: membrane_regression
  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 185
      max_out_spikes: 9000
      init_k: 8.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 32
      max_out_spikes: 45000
      init_k: 8.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 512
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 10
  batch_size: 4
  seed: 42
