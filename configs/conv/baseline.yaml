run_name: baseline
# 軟體端訓練演算法定案後(weight_decay=1e-2 + 餘弦退火,見
# docs/問題紀錄.md 第十六節)的第一次放大資料量驗證:從一直在用的
# train_size=1000/val_size=200 debug 子集,跳到 train_size=10000/val_size=2000
# (N-MNIST Train/ 60000 筆完整切分是 54000/6000,先抓這個中間量級,不是全量),
# 看準確率會不會隨資料量提升——2026-09-19 討論定案,之後專案重心轉向
# CSNN-FPGA 硬體端可行性,這是訓練演算法這條線目前最後一次放大實驗。
#
# lr 1e-3→5e-3:lr=1e-3(跟這份 config 完全一樣的 weight_decay+cosine 組合,
# train_size=1000)測過,穩定性最好但 100 epoch 內準確率反而比 lr=1e-2 低
# (0.805 vs 0.835/0.850)——判讀是步數預算不夠、不是單純變好。5e-3 選在
# 1e-3(太保守)跟 1e-2(仍有偶發反彈)中間,資料量放大後每個 epoch 的梯度
# 更新次數也跟著變多,實際會不會需要再調,這次還沒驗證過。
#
# batch_size 4→16:純粹是加速,4 對這個資料量太小、GPU 沒有用滿。
# max_queue_len/max_out_spikes/max_extra_steps 這三個動態容量旋鈕取的是整個 batch 裡最大的
# 那一筆樣本(example/train_conv_compressed.py 的 reduced diag 用 jnp.max),
# 不是加總,所以放大 batch_size 不會讓容量跟著等比例爆開,只是佔用記憶體
# 隨 batch_size 線性成長(vmap 的 batch 維度)——一般訓練都有的正常關係,先跑
# 過煙霧測試(3 epoch)確認沒 OOM 才正式跑完整 60 epoch。

model:
  decoder: membrane_regression

  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      max_queue_len: 185
      max_out_spikes: 1
      max_extra_steps: 0
      init_k: 5.0
      max_queue_len_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_extra_steps_grow_factor: 1.5
      max_extra_steps_shrink_threshold: 0.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      max_queue_len: 32
      max_out_spikes: 1
      max_extra_steps: 0
      init_k: 5.0
      max_queue_len_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_extra_steps_grow_factor: 1.5
      max_extra_steps_shrink_threshold: 0.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 1024
      init_k: 5.0

data:
  max_events: 2000
  train_size: 10000
  val_size: 2000
  seed_train: 0
  seed_val: 0

train:
  lr: 5.0e-3
  epochs: 60
  batch_size: 16
  seed: 42
  weight_snapshot_every: 1
  weight_decay: 1.0e-2
  lr_cosine_decay: true
