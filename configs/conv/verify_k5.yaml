run_name: verify_k5
# V6 init_k 對照組 R2:正式 baseline / 選項 II(init_k 全部 5.0)。
# 等同 compressed_baseline.yaml,只是 epochs 40 -> 10、run_name 不同,
# 方便跟 verify_k_lee / verify_k_firing / verify_k8 同條件對照。

model:
  decoder: membrane_regression
  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 185
      max_out_spikes: 9000
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 1
      L: 32
      max_out_spikes: 45000
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 512
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 10
  batch_size: 4
  seed: 42
