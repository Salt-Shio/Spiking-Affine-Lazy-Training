# 量化實驗:python -m example.quantize configs/quant/b8_fa6_fv6.yaml
# 輸出到 experiments/<source.run>/quant/<資料夾名>/,名字由 source.params、calibration、spec 自動組成。
# 規格是 notebook membrane_quantization 掃描挑出的那組(用 epoch 59 權重挑的,這裡改用 best)。

source:
  run: scale_10k_20260919_050446   # experiments/ 底下的資料夾名
  params: best                     # best、final,或 epoch 編號(weights/epoch_XXX.npz)

calibration:
  split: val                       # 量膜電位範圍 M 用哪個 split:val 或 train(seed 照來源 run)
  n_samples: 50                    # 用前幾筆;val 不能超過來源 run 的 val_size

verify:
  n_samples: null                  # 跑幾筆 val 存成參考輸出;null 是 run 的整個 val

spec:
  bits: 8                          # 權重碼位元數
  f_a: 6                           # 衰減碼小數位元
  f_V: 6                           # 膜電位暫存器小數位元
  round_mode: round                # round 或 truncate
  out_granularity: per_channel     # 輸出層的 s_c:per_channel 或 per_tensor;其他層固定逐 channel
  clip_percentile: 100             # 權重截斷門檻取 |w| 的第幾百分位,100 = 不截斷
  overflow_mode: wrap              # 暫存器溢位:wrap 或 saturate
  guard_bits: 1                    # 保護位元:每層 i_V 在校準算出的值上再加幾個位元
  i_V: null                        # 直接指定每層 i_V({層名: 值},guard_bits 要是 0);null 是校準值加 guard_bits
