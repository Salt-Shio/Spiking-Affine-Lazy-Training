[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spiking-affine-lazy-training"
version = "0.0.0"
description = "CSNN-FPGA 的訓練端:單狀態仿射 LIF、事件驅動、chunk 化平行掃描,支援 conv 架構"
requires-python = ">=3.11"
# 依賴清單維持在 requirements.txt(conda 環境 jax 已完整安裝);這裡刻意不重列,
# 這個套件用 `pip install -e . --no-deps` 註冊,不透過 pip 解析依賴。
dependencies = []

[tool.setuptools]
packages = [
    "salt_core",
    "salt_core.connectivity",
    "salt_core.tests",
    "data",
    "data.src",
    "data.viz",
    "data.tests",
    "example",
    "example.analysis",
    "example.models",
    "example.tests",
    "viz",
    "viz.tests",
]

[tool.pytest.ini_options]
testpaths = ["salt_core/tests", "example/tests", "data/tests", "viz/tests"]
addopts = "-ra"
