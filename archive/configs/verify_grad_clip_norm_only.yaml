run_name: compressed_grad_clip_norm_only_verify
# 單獨驗證 grad_clip_norm(症狀層:夾住單步梯度長度):複製自 baseline.yaml,
# 只加 train.grad_clip_norm,不設 weight_decay/score_cap/lr_cosine_decay。
# label_smoothing 已撤除(docs/問題紀錄.md 第十五節)。
#
# 動機(docs/math/梯度下降曲率穩定性推導.md 第 8.1 節):跟 weight_decay/
# score_cap 不同,這裡不改模型體質(不動權重量級、不動輸出上限),只把
# Edge of Stability 發作當下那一步踩出去的位移長度鎖住上限,擋住第十五節
# 記錄的 28 倍 step_ratio 反彈。grad_clip_norm 之前只在三機制合測裡出現過,
# 沒有乾淨隔離過——那次的死亡崩潰後來定位是同批合測的 label_smoothing,不是
# grad_clip_norm 本身,所以這次要單獨測看它有沒有用。
#
# grad_clip_norm=10.0 的來源:延續之前討論這個機制時用的同一個值,維持跟
# 三機制合測那次的可比較性(這次是拆開來乾淨測)。

model:
  decoder: membrane_regression

  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      L: 185
      max_out_spikes: 1
      max_steps: 1
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      L: 32
      max_out_spikes: 1
      max_steps: 1
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 1024
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 100
  batch_size: 4
  seed: 42
  weight_snapshot_every: 1
  grad_clip_norm: 10.0
