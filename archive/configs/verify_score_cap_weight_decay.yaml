run_name: compressed_score_cap_weight_decay_verify
# 疊加驗證:score_cap(§8.4)+ weight_decay(§8.2)兩個各自單獨測過、沒有引發
# 神經元死亡的機制一起上,grad_clip_norm/label_smoothing 已撤除不用。
#
# 單獨測的結果(docs/問題紀錄.md 第十五節):
# - weight_decay=1e-2 單獨:沒有死亡風險,擋住不可逆崩潰(最後 20 epoch
#   val_acc 平均 0.738 vs 原始 0.621),但沒有消除震盪本身。
# - score_cap=6.0 單獨:目前四次嘗試裡表現最好(best val_acc 0.865、最後
#   20 epoch 平均 0.783),train_loss 能正常壓到 ~0.0094 沒有被人工卡住,但
#   epoch40 附近仍有一次明顯反彈(loss 0.01->0.41)。
#
# 兩者機制上不衝突(一個限權重量級、一個限輸出上限,都不碰分類目標本身,
# 不像 label smoothing 會降低分類壓力本身),疊加測試能不能把剩下的反彈也
# 壓下去。

model:
  decoder: membrane_regression

  input_shape: [2, 34, 34]

  layers:
    - type: conv
      oc: 8
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      L: 185
      max_out_spikes: 1
      max_steps: 1
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: conv
      oc: 16
      k: 3
      s: 2
      p: 1
      tau: 16.0
      v_th: 1.0
      alpha: 2.0
      chunk_size: 4
      L: 32
      max_out_spikes: 1
      max_steps: 1
      init_k: 5.0
      L_grow_factor: 1.5
      out_grow_factor: 1.5
      out_shrink_threshold: 0.5
      max_steps_grow_factor: 1.5
      max_steps_shrink_threshold: 0.5
    - type: fc
      name: out
      n_out: 10
      tau: 16.0
      v_th: 1.0e+9
      alpha: 2.0
      chunk_size: 1024
      init_k: 5.0

data:
  max_events: 2000
  train_size: 1000
  val_size: 200
  seed_train: 0
  seed_val: 0

train:
  lr: 1.0e-2
  epochs: 100
  batch_size: 4
  seed: 42
  weight_snapshot_every: 1
  score_cap: 6.0
  weight_decay: 1.0e-2
